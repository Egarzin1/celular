/* WHATSAPP */
let waNextId = 1;

function criarConversasPadrao(){
    // WhatsApp começa vazio. Conversa só aparece quando você abre pelo app Contatos
    // ou quando o Pawn mandar mensagem para um número que existe nos contatos.
    contatos=[];
    waNextId=1;
}

function buscarContatoTelefone(valor){
    valor=String(valor||"").toLowerCase().trim();
    if(!valor)return null;
    return contatosTelefone.find(c=>String(c.numero||"").toLowerCase()===valor || String(c.nome||"").toLowerCase()===valor) || null;
}

function garantirConversaDoContato(c){
    if(!c)return null;
    let conversa=contatos.find(x=>String(x.numero||"")===String(c.numero));
    if(!conversa){
        conversa={
            id: waNextId++,
            nome:String(c.nome||"Sem Nome"),
            numero:String(c.numero||"000"),
            avatar:inicialContato(c.nome),
            ultima:"Toque para enviar mensagem",
            hora:"",
            naoLidas:0,
            mensagens:[]
        };
        contatos.push(conversa);
    }
    return conversa;
}

function abrirWhatsapp(){
    abrirTela("whatsapp-screen");
    document.getElementById("wa-loading-screen").classList.add("active");
    setTimeout(()=>{
        document.getElementById("wa-loading-screen").classList.remove("active");
        renderizarLista();
        atualizarBotaoEnvio();
    },700);
}

function abrirWhatsappSemLoading(){abrirTela("whatsapp-screen");renderizarLista();atualizarBotaoEnvio()}
function abrirConfigWhatsapp(){abrirTela("wa-settings-screen");waInputName.value=waConfig.nome;waInputTheme.value=waConfig.tema}
function salvarConfigWhatsapp(){waConfig.nome=waInputName.value.trim()||"Sem Nome";waConfig.tema=waInputTheme.value;localStorage.setItem("wa_config",JSON.stringify(waConfig));aplicarConfigWhatsapp()}
function resetarConfigWhatsapp(){waConfig={nome:"Deivyd",tema:"dark"};localStorage.removeItem("wa_config");aplicarConfigWhatsapp();abrirConfigWhatsapp()}
function carregarConfigWhatsapp(){let s=localStorage.getItem("wa_config");if(s){try{waConfig=JSON.parse(s)}catch(e){}}aplicarConfigWhatsapp()}
function aplicarConfigWhatsapp(){let wa=document.getElementById("whatsapp-screen");wa.classList.remove("theme-dark","theme-light");wa.classList.add(waConfig.tema==="light"?"theme-light":"theme-dark")}

function renderizarLista(){
    let lista=document.getElementById("wa-list");
    lista.innerHTML="";
    if(!contatos.length){
        lista.innerHTML=`<div style="margin-top:45px;text-align:center;color:#8b9499;font-size:13px;padding:0 18px;line-height:19px;">Nenhuma conversa no WhatsApp<br><br>Vá em <b>Contatos</b>, clique em um contato e toque em <b>mensagem</b>.</div>`;
        return;
    }
    contatos.forEach(c=>{
        lista.innerHTML+=`<div class="chat-item" onclick="abrirConversa(${c.id})"><div class="avatar">${escapeHtml(c.avatar)}</div><div class="chat-info"><div class="chat-row"><div class="chat-name">${escapeHtml(c.nome)}</div><div class="chat-time">${escapeHtml(c.hora)}</div></div><div class="chat-row"><div class="chat-last">${escapeHtml(c.ultima)}</div>${c.naoLidas>0?`<div class="badge">${c.naoLidas}</div>`:""}</div></div></div>`;
    });
}

function abrirConversa(id){
    conversaAtual=contatos.find(c=>c.id===id);
    if(!conversaAtual)return;
    conversaAtual.naoLidas=0;
    convAvatar.innerText=conversaAtual.avatar;
    convName.innerText=conversaAtual.nome;
    conversation.classList.add("active");
    renderizarMensagens();
    renderizarLista();
    atualizarBotaoEnvio();
}
function voltarListaWhatsapp(){conversation.classList.remove("active");renderizarLista()}
function renderizarMensagens(){let area=messages;area.innerHTML="";conversaAtual.mensagens.forEach((m,index)=>{let div=document.createElement("div");div.className="msg "+(m.tipo==="sent"?"sent":"received");if(m.audio){div.innerHTML=`<div class="audio-bubble"><button class="audio-play" onclick="tocarAudio(${index})">▶</button><div class="audio-wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="audio-duration">${escapeHtml(m.duracao||"0:01")}</div></div><span class="msg-time">${escapeHtml(m.hora||"")}</span>`}else if(m.image){div.innerHTML=`<img class="msg-image" src="${escapeAttr(m.image)}">${m.texto?escapeHtml(m.texto):""}<span class="msg-time">${escapeHtml(m.hora||"")}</span>`}else if(m.receipt){div.innerHTML=montarComprovanteBolha(m.receipt)+`<span class="msg-time">${escapeHtml(m.hora||"")}</span>`}else{div.innerHTML=`${escapeHtml(m.texto||"")}<span class="msg-time">${escapeHtml(m.hora||"")}</span>`}area.appendChild(div)});area.scrollTop=area.scrollHeight}
function atualizarBotaoEnvio(){if(!msgInput||!micBtn||!sendBtn)return;if(gravandoAudio){micBtn.style.display="flex";sendBtn.style.display="none";return}if(msgInput.value.trim().length>0){micBtn.style.display="none";sendBtn.style.display="flex"}else{sendBtn.style.display="none";micBtn.style.display="flex"}}
function abrirEmojiFake(){msgInput.value+="😀";atualizarBotaoEnvio()}
function enviarMensagem(){let texto=msgInput.value.trim();if(!texto||!conversaAtual)return;let hora=pegarHora();conversaAtual.mensagens.push({tipo:"sent",texto,hora});conversaAtual.ultima=texto;conversaAtual.hora=hora;msgInput.value="";renderizarMensagens();renderizarLista();atualizarBotaoEnvio();enviarEventoPawn("whatsapp_send",{numero:conversaAtual.numero,nome:conversaAtual.nome,text:texto})}
function enterEnviar(e){if(e.key==="Enter")enviarMensagem()}

function receiveWhatsappMessageFromPawn(numeroOuNome,texto){
    let contato=buscarContatoTelefone(numeroOuNome);
    if(!contato){
        console.log("WhatsApp bloqueado: número/contato não existe", numeroOuNome);
        return false;
    }
    let c=garantirConversaDoContato(contato);
    let hora=pegarHora();
    c.mensagens.push({tipo:"received",texto:String(texto),hora});
    c.ultima=String(texto);
    c.hora=hora;
    if(conversaAtual&&conversaAtual.id===c.id)renderizarMensagens();else c.naoLidas++;
    renderizarLista();
    return true;
}

function sendWhatsAppFromPawn(numeroOuNome,texto){
    let contato=buscarContatoTelefone(numeroOuNome);
    if(!contato){
        console.log("WhatsApp bloqueado: número/contato não existe", numeroOuNome);
        return false;
    }
    let c=garantirConversaDoContato(contato);
    let hora=pegarHora();
    c.mensagens.push({tipo:"sent",texto:String(texto),hora});
    c.ultima=String(texto);
    c.hora=hora;
    renderizarLista();
    return true;
}

function abrirSeletorFoto(){if(conversaAtual)photoInput.click()}
function selecionarFotoWhatsapp(e){let file=e.target.files[0];if(!file||!conversaAtual)return;let r=new FileReader();r.onload=x=>enviarFotoWhatsapp(x.target.result,"Foto compartilhada");r.readAsDataURL(file);e.target.value=""}
function enviarFotoWhatsapp(url,texto=""){let hora=pegarHora();conversaAtual.mensagens.push({tipo:"sent",image:url,texto,hora});conversaAtual.ultima="📷 Foto";conversaAtual.hora=hora;renderizarMensagens();renderizarLista()}
function tirarFotoDoJogo(){enviarEventoPawn("capture_game_photo",{})}
function receberFotoJogo(url){if(!conversaAtual)abrirWhatsappSemLoading();if(!conversaAtual)abrirConversa(contatos[0].id);enviarFotoWhatsapp(url,"Foto do jogo")}
function segurarAudio(e){e.preventDefault();if(!conversaAtual||msgInput.value.trim().length>0)return;audioSegurando=true;iniciarGravacaoAudio()}
function soltarAudio(e){e.preventDefault();if(!audioSegurando)return;audioSegurando=false;pararGravacaoAudio(true)}
function cancelarAudio(e){e.preventDefault();if(!audioSegurando)return;audioSegurando=false;pararGravacaoAudio(true)}
async function iniciarGravacaoAudio(){if(gravandoAudio)return;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){iniciarAudioFakeVisual();return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data)};mediaRecorder.onstop=()=>{let s=Math.max(1,Math.floor((Date.now()-audioStartTime)/1000));let blob=new Blob(audioChunks,{type:"audio/webm"});let url=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());enviarAudioMensagem(url,s)};audioStartTime=Date.now();mediaRecorder.start();gravandoAudio=true;micBtn.classList.add("recording");micBtn.innerText="■";atualizarBotaoEnvio()}catch(e){iniciarAudioFakeVisual()}}
function iniciarAudioFakeVisual(){audioStartTime=Date.now();gravandoAudio=true;micBtn.classList.add("recording");micBtn.innerText="■";atualizarBotaoEnvio()}
function pararGravacaoAudio(enviar=true){if(!gravandoAudio)return;let s=Math.max(1,Math.floor((Date.now()-audioStartTime)/1000));if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();else if(enviar)enviarAudioMensagem("",s);gravandoAudio=false;micBtn.classList.remove("recording");micBtn.innerText="🎙";atualizarBotaoEnvio()}
function enviarAudioMensagem(url="",segundos=1){let hora=pegarHora();conversaAtual.mensagens.push({tipo:"sent",audio:true,audioUrl:url,duracao:formatarDuracaoAudio(segundos),hora});conversaAtual.ultima="🎙 Áudio";conversaAtual.hora=hora;renderizarMensagens();renderizarLista();atualizarBotaoEnvio();enviarEventoPawn("whatsapp_audio",{to:conversaAtual.nome,duration:segundos})}
function tocarAudio(i){let m=conversaAtual.mensagens[i];if(!m||!m.audio||!m.audioUrl)return;if(audioAtual){audioAtual.pause();audioAtual.currentTime=0}audioAtual=new Audio(m.audioUrl);audioAtual.play()}
function formatarDuracaoAudio(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

/* CONTATOS */
function abrirContatos(){abrirTela("contacts-screen");carregarContatosTelefone();renderizarContatos()}
function carregarContatosTelefone(){let s=localStorage.getItem("phone_contacts");if(s){try{contatosTelefone=JSON.parse(s)}catch(e){contatosTelefone=[]}}if(!Array.isArray(contatosTelefone))contatosTelefone=[]}
function salvarContatosTelefone(){localStorage.setItem("phone_contacts",JSON.stringify(contatosTelefone))}
function limparContatosTelefone(){contatosTelefone=[];localStorage.removeItem("phone_contacts");renderizarContatos()}
function inicialContato(n){return(!n||!n.length)?"?":n.trim().charAt(0).toUpperCase()}
function renderizarContatos(){
    const lista=document.getElementById("contactsList");
    const searchInput=document.getElementById("contactsSearch");
    if(!lista||!searchInput)return;
    let busca=searchInput.value.toLowerCase().trim();
    lista.innerHTML="";
    let arr=contatosTelefone.map((c,i)=>({...c,index:i})).filter(c=>String(c.nome||"").toLowerCase().includes(busca)||String(c.numero||"").toLowerCase().includes(busca)).sort((a,b)=>String(a.nome||"").localeCompare(String(b.nome||"")));
    if(!arr.length){lista.innerHTML=`<div style="margin-top:35px;text-align:center;color:#777;font-size:13px;">Nenhum contato salvo<br><br>Toque no + para adicionar.</div>`;return}
    arr.forEach(c=>{lista.innerHTML+=`<div class="contact-item" onclick="abrirDetalhesContato(${c.index})"><div class="contact-avatar">${inicialContato(c.nome)}</div><div class="contact-info"><div class="contact-name">${c.fav?"★ ":""}${escapeHtml(c.nome)}</div><div class="contact-number">${escapeHtml(c.numero)}</div></div><button class="contact-call-btn" onclick="event.stopPropagation(); iniciarLigacaoContato(${c.index});">📞</button></div>`})
}
function abrirDetalhesContato(i){
    contatoAtualIndex=i;
    let c=contatosTelefone[i];
    if(!c)return;
    document.getElementById("contactDetailsAvatar").innerText=inicialContato(c.nome);
    document.getElementById("contactDetailsName").innerText=c.nome;
    document.getElementById("contactDetailsNumber").innerText=c.numero;
    document.getElementById("contactDetailsCell").innerText=c.numero;
    document.getElementById("contactDetailsNote").innerText=c.nota||"Contato salvo no telefone";
    document.getElementById("contact-details-screen").classList.add("active")
}
function fecharDetalhesContato(){document.getElementById("contact-details-screen").classList.remove("active")}
function abrirModalContato(){
    document.getElementById("contactInputName").value="";
    document.getElementById("contactInputNumber").value="";
    document.getElementById("contactInputNote").value="";
    document.getElementById("contact-modal").classList.add("active");
    setTimeout(()=>document.getElementById("contactInputName").focus(),100);
}
function fecharModalContato(){document.getElementById("contact-modal").classList.remove("active")}
function salvarNovoContato(){
    let nome=document.getElementById("contactInputName").value.trim();
    let numero=document.getElementById("contactInputNumber").value.trim();
    let nota=document.getElementById("contactInputNote").value.trim();
    if(!nome)return alert("Digite o nome.");
    if(!numero)return alert("Digite o número.");
    contatosTelefone.push({nome,numero,nota:nota||"Contato salvo no telefone",fav:false});
    salvarContatosTelefone();
    fecharModalContato();
    renderizarContatos();
    enviarEventoPawn("add_contact",{nome,numero,nota})
}
function apagarContatoAtual(){if(contatoAtualIndex<0||!contatosTelefone[contatoAtualIndex])return;let c=contatosTelefone[contatoAtualIndex];contatosTelefone.splice(contatoAtualIndex,1);contatoAtualIndex=-1;salvarContatosTelefone();fecharDetalhesContato();renderizarContatos();enviarEventoPawn("remove_contact",c)}
function favoritarContatoAtual(){if(contatoAtualIndex<0)return;contatosTelefone[contatoAtualIndex].fav=!contatosTelefone[contatoAtualIndex].fav;salvarContatosTelefone();abrirDetalhesContato(contatoAtualIndex);renderizarContatos()}
function ligarContatoAtual(){if(contatoAtualIndex>=0)iniciarLigacaoContato(contatoAtualIndex)}
function mensagemContatoAtual(){if(contatoAtualIndex<0)return;let c=contatosTelefone[contatoAtualIndex];let conversa=garantirConversaDoContato(c);fecharDetalhesContato();abrirWhatsappSemLoading();abrirConversa(conversa.id);enviarEventoPawn("message_contact",c)}
function iniciarLigacaoContato(i){let c=contatosTelefone[i];if(!c)return;contatoAtualIndex=i;ligacaoSegundos=0;callStatus.innerText="ligando...";callName.innerText=c.nome;callNumber.innerText=c.numero;callAvatar.innerText=inicialContato(c.nome);callTimer.innerText="00:00";document.getElementById("call-screen").classList.add("active");if(ligacaoTimer)clearInterval(ligacaoTimer);setTimeout(()=>callStatus.innerText="em chamada",1200);ligacaoTimer=setInterval(()=>{ligacaoSegundos++;callTimer.innerText=String(Math.floor(ligacaoSegundos/60)).padStart(2,"0")+":"+String(ligacaoSegundos%60).padStart(2,"0")},1000);enviarEventoPawn("call_contact",c)}
function encerrarLigacao(){if(ligacaoTimer){clearInterval(ligacaoTimer);ligacaoTimer=null}let c=contatosTelefone[contatoAtualIndex];document.getElementById("call-screen").classList.remove("active");if(c)enviarEventoPawn("end_call",c)}
function setContactsFromPawn(json){try{let arr=typeof json==="string"?JSON.parse(json):json;contatosTelefone=arr.map(c=>({nome:String(c.nome||c.name||"Sem Nome"),numero:String(c.numero||c.number||"000"),nota:String(c.nota||c.note||"Contato salvo no telefone"),fav:!!c.fav}));salvarContatosTelefone();contatos=contatos.filter(w=>contatosTelefone.some(c=>String(c.numero)===String(w.numero)));renderizarContatos();renderizarLista()}catch(e){console.log(e)}}
function addContactFromPawn(nome,numero,nota){contatosTelefone.push({nome:String(nome||"Sem Nome"),numero:String(numero||"000"),nota:String(nota||"Contato salvo no telefone"),fav:false});salvarContatosTelefone();renderizarContatos()}
function startCallFromPawn(nome,numero){let i=contatosTelefone.findIndex(c=>String(c.numero)===String(numero));if(i<0){alert("Esse número não está salvo nos contatos.");return;}iniciarLigacaoContato(i)}

/* BANCO */
function abrirBanco(){abrirTela("bank-screen");renderizarBanco()}
function carregarBanco(){let s=localStorage.getItem("bank_data");if(s){try{bankData=JSON.parse(s)}catch(e){}}}
function salvarBanco(){localStorage.setItem("bank_data",JSON.stringify(bankData))}
function renderizarBanco(){bankBalance.innerText=formatMoney(bankData.saldo);bankHistory.innerHTML="";if(!bankData.historico.length){bankHistory.innerHTML=`<div class="bank-item"><div class="bank-item-title">Nenhuma movimentação</div><div class="bank-item-desc">Seu histórico aparecerá aqui.</div></div>`;return}bankData.historico.slice().reverse().forEach(i=>bankHistory.innerHTML+=`<div class="bank-item"><div class="bank-item-title">${i.tipo||"Pix enviado"} - ${formatMoney(i.valor)}</div><div class="bank-item-desc">${escapeHtml(i.destino||"")} • ${escapeHtml(i.data||"")}</div></div>`)}
function togglePixForm(){pixForm.classList.toggle("active")}
function mostrarSaldo(){renderizarBanco()}
function enviarPix(){let key=pixKey.value.trim(),val=parseFloat(String(pixValue.value).replace(",",".")),desc=pixDesc.value.trim();if(!key)return alert("Digite a chave Pix ou nome.");if(!val||val<=0)return alert("Digite um valor válido.");if(val>bankData.saldo)return alert("Saldo insuficiente.");bankData.saldo-=val;let c={id:gerarIdComprovante(),tipo:"Pix enviado",destino:key,valor:val,descricao:desc||"Pix enviado",data:dataCompleta(),nome:waConfig.nome};bankData.ultimoComprovante=c;bankData.historico.push(c);salvarBanco();renderizarBanco();pixKey.value=pixValue.value=pixDesc.value="";mostrarComprovante(c);enviarEventoPawn("bank_pix",c)}
function mostrarComprovante(c){receiptContent.innerHTML=`<div class="receipt-modal-line"><b>ID:</b> ${escapeHtml(c.id)}</div><div class="receipt-modal-line"><b>Destino:</b> ${escapeHtml(c.destino)}</div><div class="receipt-modal-line"><b>Valor:</b> ${formatMoney(c.valor)}</div><div class="receipt-modal-line"><b>Data:</b> ${escapeHtml(c.data)}</div>`;document.getElementById("receipt-modal").classList.add("active")}
function fecharComprovante(){document.getElementById("receipt-modal").classList.remove("active")}
function compartilharComprovanteWhatsapp(){if(!bankData.ultimoComprovante)return;if(!contatos.length){alert("Nenhuma conversa no WhatsApp. Abra uma conversa pelo app Contatos primeiro.");return;}abrirWhatsappSemLoading();abrirConversa(contatos[0].id);conversaAtual.mensagens.push({tipo:"sent",receipt:bankData.ultimoComprovante,hora:pegarHora()});conversaAtual.ultima="📄 Comprovante Pix";conversaAtual.hora=pegarHora();renderizarMensagens();renderizarLista();fecharComprovante()}
function compartilharUltimoComprovante(){if(!bankData.ultimoComprovante)return alert("Nenhum comprovante.");mostrarComprovante(bankData.ultimoComprovante)}
function montarComprovanteBolha(c){return`<div class="receipt-box"><div class="receipt-title">Comprovante Pix</div><div class="receipt-line"><b>ID:</b> ${escapeHtml(c.id)}</div><div class="receipt-line"><b>Para:</b> ${escapeHtml(c.destino)}</div><div class="receipt-line"><b>Valor:</b> ${formatMoney(c.valor)}</div></div>`}
function setBankFromPawn(saldo){bankData.saldo=Number(saldo)||0;salvarBanco();renderizarBanco()}
function addBankHistoryFromPawn(tipo,destino,valor,desc){let c={id:gerarIdComprovante(),tipo:String(tipo||"Movimentação"),destino:String(destino||""),valor:Number(valor)||0,descricao:String(desc||""),data:dataCompleta()};bankData.historico.push(c);bankData.ultimoComprovante=c;salvarBanco();renderizarBanco()}

/* CALC SETTINGS */
function abrirCalculadora(){abrirTela("calc-screen")}
function updateCalc(){calcDisplay.innerText=calcValor.replaceAll("*","×").replaceAll("/","÷")}
function calcInput(v){if(calcValor==="Erro")calcValor="0";let ops=["+","-","*","/"],last=calcValor[calcValor.length-1];if(calcValor==="0"&&!ops.includes(v)&&v!==".")calcValor=v;else if(ops.includes(v)&&ops.includes(last))calcValor=calcValor.slice(0,-1)+v;else calcValor+=v;updateCalc()}
function calcClear(){calcValor="0";updateCalc()}function calcToggle(){if(calcValor==="0")return;calcValor=calcValor.startsWith("-")?calcValor.substring(1):"-"+calcValor;updateCalc()}function calcPercent(){try{calcValor=String(eval(calcValor)/100);updateCalc()}catch{calcValor="Erro";updateCalc()}}function calcResult(){try{let r=eval(calcValor);calcValor=isFinite(r)?String(parseFloat(r.toFixed(8))):"Erro";updateCalc()}catch{calcValor="Erro";updateCalc()}}
function abrirConfigCelular(){abrirTela("phone-settings-screen");phoneInputWallpaper.value=phoneConfig.wallpaper;phoneInputLocation.value=phoneConfig.location}
function carregarConfigCelular(){let s=localStorage.getItem("phone_config");if(s){try{phoneConfig=JSON.parse(s)}catch(e){}}aplicarConfigCelular()}
function salvarConfigCelular(){phoneConfig.wallpaper=phoneInputWallpaper.value.trim()||phoneConfig.wallpaper;phoneConfig.location=phoneInputLocation.value.trim()||"";localStorage.setItem("phone_config",JSON.stringify(phoneConfig));aplicarConfigCelular()}
function resetarConfigCelular(){localStorage.removeItem("phone_config");phoneConfig={wallpaper:"https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=600&auto=format&fit=crop",location:"New Empire Way"};aplicarConfigCelular();abrirConfigCelular()}
function aplicarConfigCelular(){phoneScreen.style.background=`linear-gradient(135deg, rgba(255,255,255,.08), transparent 32%),url("${phoneConfig.wallpaper}")`;phoneScreen.style.backgroundSize="cover";phoneScreen.style.backgroundPosition="center"}

window.mostrarCelular=mostrarCelular;window.fecharCelular=fecharCelular;window.toggleCelular=toggleCelular;window.abrirWhatsapp=abrirWhatsapp;window.abrirBanco=abrirBanco;window.abrirContatos=abrirContatos;window.abrirCalculadora=abrirCalculadora;window.limparContatosTelefone=limparContatosTelefone;window.setContactsFromPawn=setContactsFromPawn;window.addContactFromPawn=addContactFromPawn;window.startCallFromPawn=startCallFromPawn;window.receiveWhatsappMessageFromPawn=receiveWhatsappMessageFromPawn;window.sendWhatsAppFromPawn=sendWhatsAppFromPawn;window.setBankFromPawn=setBankFromPawn;window.addBankHistoryFromPawn=addBankHistoryFromPawn;window.receberFotoJogo=receberFotoJogo;

criarConversasPadrao();carregarConfigWhatsapp();carregarConfigCelular();carregarBanco();carregarContatosTelefone();renderizarContatos();renderizarBanco();updateCalc();atualizarBotaoEnvio();
